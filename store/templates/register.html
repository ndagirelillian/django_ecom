{% extends 'base.html' %}
{% load static %}

{% block content %}

                      <h1 class="display-4 fw-bolder">Register  Page</h1>

                  </div>
              </div>
          </header>
          <div class = "container">
              
            
                     <div class="col-8">
                            <br><br>
                           
                            <form method="POST", action="{% url 'register' %}">
                                {% csrf_token %} 
                                {{ form.as_p }}
                                <br> <br>
                                <button type="submit", class=" btn btn-success"> Register</button>
                            </form>

                              <br><br>

                     </div>

     
                    
              </div>
          
{% endblock %}
